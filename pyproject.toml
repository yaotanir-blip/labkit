[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labkit"
version = "0.1.0.dev0"
description = "A lab data analysis toolkit: weighted least-squares fitting with proper uncertainties, plus a Streamlit app."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yaotanir-blip" }]
dependencies = [
    "numpy>=2.5",
    "matplotlib>=3.11",
]

[project.urls]
Repository = "https://github.com/yaotanir-blip/lab_analysis"

[tool.pytest.ini_options]
testpaths = ["tests"]